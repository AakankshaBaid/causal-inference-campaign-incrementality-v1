# Spring sale 2025 -- shallower discount, shorter window, no stacking split.
# Included to show the framework generalises across campaign shapes without
# code changes.
name: Spring Sale 2025
activation_week: 2025-03-31
campaign_scope: global_simultaneous   # promotion runs in every market at once
pre_weeks: 78
post_weeks: 6
transition_weeks: 1

outcomes: [gbv, room_nights]
primary_outcome: gbv

model:
  backend: bsts
  design_version: cross_product_control   # see PREDICTOR_SETS in config.py for Design A-Design D
  control_prior_campaign: true
  prior_campaign_weeks: 10
  annual_fourier_terms: 2
  alpha: 0.10
  n_bootstrap: 2000

economics:
  take_rate: 0.155
  variable_cost_rate: 0.030
  discount_depth: 0.08
  discounted_booking_share: 0.31
  discount_funded_share: 0.08
  fixed_campaign_cost: 450000

notes: >
  Shallower discount at 8% depth. Used as the counter-example in the
  promotional calendar review: a smaller lift that clears break-even by a
  wider margin than the Black Friday campaign.
